services:
  - type: web
    name: vexostream-core
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
